server {
    listen 80;
    server_name _;
    client_max_body_size 520m;
    location = /docs {
        proxy_pass http://backend:8000;
    }
    location = /openapi.json {
        proxy_pass http://backend:8000;
    }
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_read_timeout 300s;
        proxy_set_header Host $host;
    }
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}
