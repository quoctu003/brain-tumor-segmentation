services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: braintumor
      POSTGRES_USER: braintumor
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your shell or .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U braintumor"]
      interval: 5s
      timeout: 5s
      retries: 10
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://braintumor:${POSTGRES_PASSWORD}@database:5432/braintumor
      STORAGE_DIR: /project/storage
      MODEL_PATH: /project/models/unet_v2_best.pth
      MODEL_METADATA_PATH: /project/models/model_metadata.json
      DEVICE: cpu
    volumes:
      - ./models:/project/models:ro
      - casefiles:/project/storage
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5)"]
      interval: 10s
      timeout: 10s
      start_period: 120s
      retries: 6
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      backend:
        condition: service_healthy
volumes:
  pgdata:
  casefiles:
